server:
  port: 8080
  # Honor X-Forwarded-* headers so the correct browser-facing origin (e.g. behind the
  # nginx SPA container) is used when building OAuth redirect URIs.
  forward-headers-strategy: framework

spring:
  application:
    name: bff-gateway

  # Server-side session store. Tokens live here, never in the browser.
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # 'redis' in Docker, 'localhost' when run directly
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis                 # keep OAuth tokens in Redis-backed sessions
    timeout: 30m                      # idle session lifetime

  security:
    oauth2:
      client:
        provider:
          idp:
            # OIDC discovery: the BFF reads the provider's endpoints + JWKS from
            # {issuer-uri}/.well-known/openid-configuration at startup.
            issuer-uri: ${IDP_ISSUER_URI:http://127.0.0.1:9000}
        registration:
          idp:
            provider: idp                       # references the provider block above
            client-id: bff-client               # must match a RegisteredClient on the IdP
            client-secret: bff-secret           # matches {noop}bff-secret registered on the IdP
            client-name: Demo IdP
            authorization-grant-type: authorization_code   # the interactive login flow
            # {baseUrl} resolves to the browser-facing gateway origin; must match a registered redirect URI.
            redirect-uri: "{baseUrl}/login/oauth2/code/idp"
            # Scopes requested at login: openid+profile (OIDC) and the two resource-server scopes.
            scope:
              - openid
              - profile
              - orders.read
              - profile.read

  cloud:
    gateway:
      server:
        webflux:
          # SaveSession persists the session (with tokens) before routing.
          # TokenRelay swaps the session for a Bearer access token on the downstream call.
          default-filters:
            - SaveSession
            - TokenRelay
          routes:
            # Requests matching /api/orders/** are proxied to the orders resource server ...
            - id: orders-service
              uri: ${ORDERS_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/orders/**
            # ... and /api/profile/** to the profile resource server.
            - id: profile-service
              uri: ${PROFILE_URI:http://127.0.0.1:8082}
              predicates:
                - Path=/api/profile/**

logging:
  level:
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
