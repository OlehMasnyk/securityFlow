server:
  port: 9000

spring:
  application:
    name: authorization-server

app:
  issuer-uri: ${ISSUER_URI:http://127.0.0.1:9000}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
