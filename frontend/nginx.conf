# The SPA and the BFF share a single browser-facing origin (this nginx).
# Static files are served locally; the OAuth/API paths are reverse-proxied to the BFF gateway.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bff {
    server bff-gateway:8080;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve the browser-facing origin so the BFF builds correct OAuth redirect URIs.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/    { proxy_pass http://bff; }
    location /oauth2/ { proxy_pass http://bff; }
    location /login   { proxy_pass http://bff; }
    location /logout  { proxy_pass http://bff; }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
