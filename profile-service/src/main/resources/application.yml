server:
  port: 8082

spring:
  application:
    name: profile-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate incoming Bearer JWTs against this issuer: fetch its JWK set to verify the
          # signature and require a matching iss claim. Must equal the token's issuer.
          issuer-uri: ${IDP_ISSUER_URI:http://127.0.0.1:9000}

management:
  endpoints:
    web:
      exposure:
        include: health   # expose only /actuator/health (for Docker healthchecks)
